name: Gerar modelo CSV

on:
  workflow_dispatch:

jobs:
  gerar-modelo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar Dependencias
        run: pip install requests reportlab

      - name: Gerar modelo
        env:
          MOVIDESK_TOKEN: ${{ secrets.MOVIDESK_TOKEN }}
        run: python gerar_modelo_csv.py

      - name: Disponibilizar arquivo
        uses: actions/upload-artifact@v4
        with:
          name: modelo-metricas
          path: modelo_metricas_artigos.csv
