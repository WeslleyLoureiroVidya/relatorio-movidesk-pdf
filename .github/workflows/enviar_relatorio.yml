name: Enviar Relatório Movidesk

on:
  workflow_dispatch:
    inputs:
      periodo:
        description: "Período do relatório"
        required: true
        default: "acumulado"
        type: choice
        options:
          - acumulado
          - este_mes
          - mes_passado
          - este_ano
          - ano_passado
          - personalizado
      data_inicio:
        description: "Início (AAAA-MM-DD) - só para 'personalizado'"
        required: false
        type: string
      data_fim:
        description: "Fim (AAAA-MM-DD) - só para 'personalizado'"
        required: false
        type: string
  schedule:
    - cron: "0 11 * * 1"   # segunda 11:00 UTC = 08:00 em Brasília

jobs:
  gerar-e-enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar Dependencias
        run: pip install requests reportlab

      - name: Executar Script de Geracao e Envio
        env:
          MOVIDESK_USER: ${{ secrets.MOVIDESK_USER }}
          MOVIDESK_PASSWORD: ${{ secrets.MOVIDESK_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_DESTINATARIO: ${{ secrets.MAIL_DESTINATARIO }}
          PERIODO: ${{ github.event.inputs.periodo || 'acumulado' }}
          DATA_INICIO: ${{ github.event.inputs.data_inicio }}
          DATA_FIM: ${{ github.event.inputs.data_fim }}
        run: python gerar_relatorio.py
