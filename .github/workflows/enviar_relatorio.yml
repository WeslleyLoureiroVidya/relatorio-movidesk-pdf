name: Enviar Relatorio Movidesk por Email

on:
  schedule:
    # Roda toda segunda-feira às 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: # Permite disparar manualmente a qualquer momento

jobs:
  gerar-e-enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          pip install requests reportlab

      - name: Executar Script de Geracao e Envio
        env:
          MOVIDESK_TOKEN: ${{ secrets.MOVIDESK_TOKEN }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_DESTINATARIO: ${{ secrets.MAIL_DESTINATARIO }}
        run: |
          python gerar_relatorio.py
